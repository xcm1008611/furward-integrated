<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Furward 骨骼动画检查</title>
<style>body{margin:0;background:#ebe8e0;color:#263238;font:15px system-ui}header{padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:7px 12px;border:1px solid #aaa;border-radius:5px;background:white}button:hover{background:#dde7d8}#view{width:1200px;height:850px;max-width:100vw}#status{margin-left:12px;font-variant-numeric:tabular-nums}footer{padding:8px 24px}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/web/node_modules/three/build/three.module.js","three/addons/":"/web/node_modules/three/examples/jsm/"}}</script>
</head><body><header><strong>原模型 · 骨骼动画检查</strong><select id="clip"><option>walk</option><option>idle</option><option>turn_left</option><option>turn_right</option><option>stop</option></select><button id="play">播放</button><button data-time="0">起步</button><button data-time="0.84">中步</button><button id="stop">停步</button><button id="front">正面</button><button id="side">侧面</button><button id="threequarter">三分之四</button><button id="bones">骨架</button><button id="save">保存当前预览</button><span id="status">加载中</span></header><div id="view"></div><footer>米制 · Y 向上 · +Z 为前方 · 原地步态；实际位移由路线控制器负责。原始网格、UV、法线、材质和贴图二进制保持不变。</footer>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { collectFootContacts, groundFootContacts, restoreFootContacts } from '/rig-foot-contact.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color('#ebe8e0');
const camera=new THREE.PerspectiveCamera(36,1200/850,.01,100);camera.position.set(3,2.1,4.2);camera.lookAt(0,.82,0);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,850);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.querySelector('#view').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f3ff,0x81745f,2));const key=new THREE.DirectionalLight(0xffeddb,3.8);key.position.set(3,6,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=4;key.shadow.camera.bottom=-4;key.shadow.bias=-.00015;scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xdcd9d0,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=0;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(10,50,0xa6aaa2,0xc4c6bc);grid.position.y=.0004;grid.material.transparent=true;grid.material.opacity=.3;scene.add(grid);
const models=[];const loader=new GLTFLoader();let playing=false,elapsed=0,clipName='walk',skeletons=false;const status=document.querySelector('#status');
const manifest=await fetch('/web/public/city/animated/rig-manifest.json').then(r=>r.json());
const qa=document.createElement('div');qa.style.cssText='padding:0 24px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap';qa.innerHTML='<label><input id="contact" type="checkbox" checked>运行时脚底约束</label><label><input id="route-speed" type="checkbox" checked>按1.2米/秒步频</label><button id="mixed-stop">37.5%相位停车</button><button id="mixed-start">站立起步</button><button id="step-frame">推进一帧</button>';document.querySelector('#view').before(qa);let blended=false,maxLift=0,solveMs=0;
const subject=document.createElement('select');subject.setAttribute('aria-label','模型');subject.innerHTML='<option value="both">人物与狗</option><option value="human">只看人物</option><option value="dog">只看机器狗</option>';document.querySelector('header').insertBefore(subject,status);
document.querySelectorAll('button,select').forEach(el=>el.disabled=true);
for(const [kind,x] of [['human',-.68],['dog',.72]]){const g=await loader.loadAsync('/web/public/city/animated/'+kind+'.glb?v='+Date.now());g.scene.position.set(x,.003,0);g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g.scene);const helper=new THREE.SkeletonHelper(g.scene);helper.visible=false;helper.material.depthTest=false;helper.renderOrder=5;scene.add(helper);const mixer=new THREE.AnimationMixer(g.scene);models.push({kind,scene:g.scene,mixer,clips:g.animations,helper,action:null,feet:collectFootContacts(g.scene),nominal:manifest.models[kind].nominal_walk_speed_mps})}
function begin(m,name){const action=m.mixer.clipAction(THREE.AnimationClip.findByName(m.clips,name));action.reset().setEffectiveWeight(1).setEffectiveTimeScale(name==='walk'&&document.querySelector('#route-speed').checked?1.2/m.nominal:1);action.setLoop(name==='stop'?THREE.LoopOnce:THREE.LoopRepeat,Infinity);action.clampWhenFinished=true;action.play();return action}
function constrain(){scene.updateMatrixWorld(true);const start=performance.now();maxLift=0;if(document.querySelector('#contact').checked)for(const m of models)maxLift=Math.max(maxLift,groundFootContacts(m.feet,()=>0,0));solveMs=performance.now()-start}
function pose(name,time){blended=false;clipName=name;elapsed=time;for(const m of models){restoreFootContacts(m.feet);m.mixer.stopAllAction();m.action=begin(m,name);m.action.time=time;m.mixer.update(0)}document.querySelector('#clip').value=name;document.querySelector('#play').textContent=playing?'暂停':'播放';constrain();render()}
function render(){scene.updateMatrixWorld(true);renderer.render(scene,camera);status.textContent=clipName+' · '+elapsed.toFixed(3)+'s · 脚底修正 '+(maxLift*1000).toFixed(1)+'mm · '+solveMs.toFixed(2)+'ms'}
function mixed(from,to,phase){playing=false;blended=true;clipName='mixed_'+to;elapsed=0;for(const m of models){restoreFootContacts(m.feet);m.mixer.stopAllAction();const prev=begin(m,from);prev.time=prev.getClip().duration*phase;m.mixer.update(0);m.action=begin(m,to);prev.crossFadeTo(m.action,.22,false)}constrain();render();document.querySelector('#play').textContent='播放'}
function step(dt){elapsed+=dt;for(const m of models){if(blended&&m.action.getClip().name==='stop'&&!m.action.isRunning()){const prev=m.action;m.action=begin(m,'idle');prev.crossFadeTo(m.action,.22,false)}restoreFootContacts(m.feet);m.mixer.update(dt)}constrain();render()}
document.querySelector('#mixed-stop').onclick=()=>mixed('walk','stop',.375);document.querySelector('#mixed-start').onclick=()=>mixed('idle','walk',0);document.querySelector('#step-frame').onclick=()=>{playing=false;step(1/60)};
document.querySelector('#contact').onchange=()=>{models.forEach(m=>{restoreFootContacts(m.feet);m.mixer.update(0)});constrain();render()};document.querySelector('#route-speed').onchange=()=>pose('walk',0);
subject.onchange=()=>{for(const m of models){m.scene.visible=subject.value==='both'||subject.value===m.kind;m.scene.position.x=subject.value==='both'?(m.kind==='human'?-.68:.72):0;m.helper.visible=skeletons&&m.scene.visible}render()};
document.querySelector('#clip').onchange=e=>{playing=false;pose(e.target.value,0)};
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放'};
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{playing=false;pose('walk',Number(b.dataset.time))});
document.querySelector('#stop').onclick=()=>{playing=false;pose('stop',.48)};
document.querySelector('#front').onclick=()=>{camera.position.set(0,1.25,5.4);camera.lookAt(0,.83,0);render()};
document.querySelector('#side').onclick=()=>{camera.position.set(5,1.4,.15);camera.lookAt(0,.80,0);render()};
document.querySelector('#threequarter').onclick=()=>{camera.position.set(3,2.1,4.2);camera.lookAt(0,.82,0);render()};
document.querySelector('#bones').onclick=()=>{skeletons=!skeletons;models.forEach(m=>m.helper.visible=skeletons);render()};
document.querySelector('#save').onclick=async()=>{render();const name=clipName+'-'+elapsed.toFixed(2)+'-'+(skeletons?'bones':'mesh')+'.png';const blob=await new Promise(r=>renderer.domElement.toBlob(r,'image/png'));const response=await fetch('/save-preview/'+name,{method:'POST',body:blob});status.textContent=response.ok?'已保存 '+name:'保存失败'};
document.querySelectorAll('button,select').forEach(el=>el.disabled=false);pose('walk',0);let prev=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-prev)/1000,.04);prev=now;if(playing)step(dt)}requestAnimationFrame(tick);
</script></body></html>
